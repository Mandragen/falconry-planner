    </div>

<script id="logic">
/* Pure logic: no DOM. Tested in Node. */
var FP = (function(){
  var LIMIT_KEYS=['minTemp','maxTemp','maxWind','maxGust','maxPop','coldTemp','heatTemp','stormGust'];
  var SPECIES=[
    {id:'rt',name:'Red-tailed hawk',minTemp:20,maxTemp:85,maxWind:15,maxGust:22,maxPop:30,coldTemp:10,heatTemp:90,stormGust:35},
    {id:'hh',name:"Harris's hawk",minTemp:30,maxTemp:90,maxWind:15,maxGust:20,maxPop:30,coldTemp:25,heatTemp:95,stormGust:30},
    {id:'pf',name:'Peregrine falcon',minTemp:15,maxTemp:85,maxWind:20,maxGust:28,maxPop:25,coldTemp:5,heatTemp:88,stormGust:35},
    {id:'ch',name:"Cooper's hawk",minTemp:25,maxTemp:90,maxWind:12,maxGust:18,maxPop:25,coldTemp:15,heatTemp:90,stormGust:30},
    {id:'ak',name:'American kestrel',minTemp:30,maxTemp:90,maxWind:12,maxGust:18,maxPop:20,coldTemp:20,heatTemp:92,stormGust:30},
    {id:'other',name:'Other or unlisted',minTemp:25,maxTemp:85,maxWind:15,maxGust:22,maxPop:30,coldTemp:20,heatTemp:90,stormGust:30}
  ];
  var DEMO_NAMES={rt:'Juno',hh:'Ajax',pf:'Skye',ch:'Willow',ak:'Pip'};
  var COLORS=['#3b82f6','#8b5cf6','#ec4899','#06b6d4','#78716c','#f97316'];
  function speciesById(id){ for(var i=0;i<SPECIES.length;i++) if(SPECIES[i].id===id) return SPECIES[i]; return SPECIES[SPECIES.length-1]; }
  /* A bird's working limits: its own override if set, else the species starter value. */
  function effective(bird){
    var sp=speciesById(bird.speciesId), o=bird.limits||{}, out={name:bird.name,species:sp.name};
    LIMIT_KEYS.forEach(function(k){ out[k]=(typeof o[k]==='number'&&!isNaN(o[k]))?o[k]:sp[k]; });
    return out;
  }
  function rate(v, lim, margin, dir){
    if(dir==='max'){ if(v>lim) return 2; if(v>lim-margin) return 1; return 0; }
    if(v<lim) return 2; if(v<lim+margin) return 1; return 0;
  }
  function scoreHour(h, p){
    var reasons=[], worst=0;
    function add(lvl, txt){ if(lvl>0){ reasons.push((lvl===2?'Over limit: ':'Close to limit: ')+txt); if(lvl>worst) worst=lvl; } }
    if(h.day===false) return {level:3,key:'DARK',label:'Dark',reasons:['After dark']};
    add(rate(h.temp,p.minTemp,5,'min'),'temperature '+Math.round(h.temp)+'F, minimum '+p.minTemp+'F');
    add(rate(h.temp,p.maxTemp,5,'max'),'temperature '+Math.round(h.temp)+'F, maximum '+p.maxTemp+'F');
    add(rate(h.wind,p.maxWind,3,'max'),'wind '+Math.round(h.wind)+' mph, maximum '+p.maxWind);
    add(rate(h.gust,p.maxGust,4,'max'),'gusts '+Math.round(h.gust)+' mph, maximum '+p.maxGust);
    add(rate(h.pop,p.maxPop,10,'max'),'rain chance '+Math.round(h.pop)+'%, maximum '+p.maxPop+'%');
    if(h.precip>=0.03) add(2,'rain falling, '+h.precip.toFixed(2)+' in/hr');
    else if(h.precip>=0.01) add(1,'light rain, '+h.precip.toFixed(2)+' in/hr');
    var keys=['GO','CAUTION','NOGO'], labels=['Go','Caution','No-go'];
    return {level:worst,key:keys[worst],label:labels[worst],reasons:reasons};
  }
  function hourLabel(t){ var H=+t.slice(11,13); return (H%12||12)+(H<12?'a':'p'); }
  function endLabel(t){ var e=(+t.slice(11,13)+1)%24; return (e%12||12)+(e<12?'a':'p'); }
  function dayLabel(t){
    var d=new Date(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10),+t.slice(11,13));
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+hourLabel(t);
  }
  function bestWindow(scored, strict){
    var best=null, cur=null, max=strict?0:1;
    for(var i=0;i<scored.length;i++){
      var ok=scored[i].s.level<=max;
      if(ok){ if(!cur) cur={start:i,end:i}; else cur.end=i; if(!best||(cur.end-cur.start)>(best.end-best.start)) best={start:cur.start,end:cur.end}; }
      else cur=null;
    }
    return best;
  }
  function pickWindow(scored){
    var w=bestWindow(scored,true), strict=true;
    if(!w){ w=bestWindow(scored,false); strict=false; }
    return w?{start:w.start,end:w.end,strict:strict}:null;
  }
  function edgeWhy(r){
    if(r.s.key==='DARK') return 'it is after dark';
    var why=r.s.reasons.length?r.s.reasons[0].replace(/^[^:]+: /,''):'';
    return hourLabel(r.x.time)+' is '+r.s.label.toLowerCase()+(why?' ('+why+')':'');
  }
  function explainWindow(scored, w, p){
    var hrs=scored.slice(w.start,w.end+1).map(function(r){return r.x;});
    function rg(k){ var v=hrs.map(function(x){return x[k];}); return [Math.min.apply(null,v),Math.max.apply(null,v)]; }
    var t=rg('temp'), wi=rg('wind'), g=rg('gust'), pp=rg('pop'), lines=[];
    lines.push(w.strict?'It is the longest daylight stretch where every reading stays inside the limits.':'No hour is fully clear, so this is the longest daylight stretch with nothing over a limit.');
    lines.push('During it: '+Math.round(t[0])+' to '+Math.round(t[1])+'F, wind up to '+Math.round(wi[1])+' mph, gusts up to '+Math.round(g[1])+' mph, rain chance up to '+Math.round(pp[1])+'%.');
    var c=[['wind',wi[1],p.maxWind,'mph'],['gusts',g[1],p.maxGust,'mph'],['rain chance',pp[1],p.maxPop,'%']], tight=null;
    c.forEach(function(x){ var m=(x[2]-x[1])/x[2]; if(!tight||m<tight.m) tight={m:m,c:x}; });
    lines.push('Closest to a limit: '+tight.c[0]+', '+Math.round(tight.c[1])+' of '+tight.c[2]+' '+tight.c[3]+'.');
    var lowGap=t[0]-p.minTemp, highGap=p.maxTemp-t[1], tg=Math.min(lowGap,highGap);
    if(tg<=10) lines.push('Temperature is within '+Math.round(tg)+'F of the '+(lowGap<highGap?p.minTemp+'F minimum':p.maxTemp+'F maximum')+'.');
    var before=scored[w.start-1], after=scored[w.end+1];
    lines.push(before?'It starts here because '+edgeWhy(before)+'.':'It starts at the beginning of the forecast.');
    lines.push(after?'It ends because '+edgeWhy(after)+'.':'It runs to the end of the forecast.');
    return lines;
  }
  /* Every hour the weather service returned (a day back plus the forecast). */
  function parseAll(j){
    var H=j.hourly, out=[];
    for(var i=0;i<H.time.length;i++){
      out.push({time:H.time[i],temp:H.temperature_2m[i],feels:H.apparent_temperature?H.apparent_temperature[i]:H.temperature_2m[i],
        wind:H.wind_speed_10m[i],gust:H.wind_gusts_10m[i],pop:H.precipitation_probability[i]||0,precip:H.precipitation[i]||0,
        code:H.weather_code?H.weather_code[i]:0,day:H.is_day[i]===1});
    }
    return out;
  }
  function parseForecast(j){
    var all=parseAll(j), off=j.utc_offset_seconds||0, nowLoc=new Date(Date.now()+off*1000).toISOString().slice(0,13), start=0;
    for(var k=0;k<all.length;k++){ if(all[k].time.slice(0,13)>=nowLoc){ start=k; break; } }
    return all.slice(start,start+48);
  }
  function hourAt(all, ts){
    if(!all||!ts) return null; var key=ts.slice(0,13);
    for(var i=0;i<all.length;i++) if(all[i].time.slice(0,13)===key) return all[i];
    return null;
  }
  function demoForecast(){
    var out=[], d=new Date(), base=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours());
    var pad=function(n){return (n<10?'0':'')+n;};
    for(var i=-24;i<48;i++){
      var t=new Date(base.getTime()+i*3600000), H=t.getHours();
      var ts=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())+'T'+pad(H)+':00';
      var temp=38+14*Math.sin((H-9)/24*2*Math.PI)+8-(i>=24?9:0), wind=5+7*Math.abs(Math.sin(H/5)), rainy=(H>=15&&H<=17&&i>=0&&i<24);
      out.push({time:ts,temp:temp,feels:temp-wind*0.4,wind:wind,gust:9+10*Math.abs(Math.sin(H/5)),
        pop:H>=14&&H<=18?55:10,precip:rainy?0.05:0,code:rainy?80:0,day:H>=7&&H<=17});
    }
    return out;
  }
  function outlook(all, p, startKey, maxDays){
    var days=[], byDate={}, order=[];
    for(var i=0;i<all.length;i++){
      var t=all[i].time; if(t.slice(0,13)<startKey) continue;
      var d=t.slice(0,10); if(!byDate[d]){ byDate[d]=[]; order.push(d); }
      byDate[d].push(all[i]);
    }
    order.slice(0,maxDays).forEach(function(d){
      var hrs=byDate[d], dayHrs=hrs.filter(function(x){return x.day!==false;}), r={date:d,hours:hrs.length,daylight:dayHrs.length};
      var sh=dayHrs.length?dayHrs:hrs;
      var temps=sh.map(function(x){return x.temp;}), gusts=sh.map(function(x){return x.gust;}), winds=sh.map(function(x){return x.wind;}), pops=sh.map(function(x){return x.pop;});
      r.hi=Math.round(Math.max.apply(null,temps)); r.lo=Math.round(Math.min.apply(null,temps));
      r.maxWind=Math.round(Math.max.apply(null,winds)); r.maxGust=Math.round(Math.max.apply(null,gusts)); r.maxPop=Math.round(Math.max.apply(null,pops));
      if(!dayHrs.length){ r.key='DARK'; r.label='No daylight left'; r.win=null; days.push(r); return; }
      var sc=dayHrs.map(function(x){return {x:x,s:scoreHour(x,p)};}), w=pickWindow(sc), n=w?(w.end-w.start+1):0;
      if(w&&w.strict&&n>=2){ r.key='GO'; r.label='Go'; }
      else if(w&&(w.strict||n>=2)){ r.key='CAUTION'; r.label='Caution'; }
      else { r.key='NOGO'; r.label='No-go'; }
      r.win=w?{from:hourLabel(sc[w.start].x.time),to:endLabel(sc[w.end].x.time),hours:n,strict:w.strict}:null;
      days.push(r);
    });
    return days;
  }
  function futureFrom(all){
    var d=new Date(), pad=function(n){return (n<10?'0':'')+n;};
    var key=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours());
    for(var i=0;i<all.length;i++) if(all[i].time.slice(0,13)>=key) return all.slice(i,i+48);

      'Reports and exports are self-reported logbooks, not certified or verified records.',
      'Provided as is, with no warranties. To the fullest extent the law allows, the maker is not liable for losses from using it. Use is free during the beta.',
      'Stoop, its design, text and code are copyrighted, all rights reserved. Please do not copy or redistribute them.'];
  }
  function betaList(){ return h('ul',{class:'why'},betaPoints().map(function(t){ return h('li',null,t); })); }
  function renderBeta(){
    document.getElementById('tabs').textContent=''; document.getElementById('birdbar').textContent='';
    TABS.forEach(function(x){ document.getElementById('tab-'+x[0]).hidden=true; });
    var root=document.getElementById('tab-today'); root.hidden=false; root.textContent='';
    var cb=h('input',{id:'beta-ok',type:'checkbox',style:'width:auto;margin-top:3px'}), go=h('button',{class:'btn',id:'beta-go',type:'button',disabled:'disabled'},'Continue to Stoop');
    var share=h('input',{id:'beta-share',type:'checkbox',style:'width:auto;margin-top:3px'});
    cb.addEventListener('change',function(){ if(cb.checked) go.removeAttribute('disabled'); else go.setAttribute('disabled','disabled'); });
    go.addEventListener('click',function(){ if(!cb.checked) return; var d=new Date(),p=function(n){return (n<10?'0':'')+n;}; S.betaAck=BETA_VERSION; S.betaAckAt=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); setShare(share.checked); save(); renderAll(); fetchForecast(); sendUsageIfDue(); });
    root.append(h('div',{class:'card',id:'beta-card'},h('h2',null,'Before you start: Stoop is a beta'),betaList(),
      h('label',{for:'beta-ok',style:'display:flex;gap:8px;align-items:flex-start;margin:12px 0 6px;color:var(--ink);font-size:.95rem;font-weight:400'},cb,'I understand and agree to use the beta on these terms.'),
      h('label',{for:'beta-share',style:'display:flex;gap:8px;align-items:flex-start;margin:6px 0 12px;color:var(--ink);font-size:.95rem;font-weight:400'},share,'Optional: help improve Stoop by sharing anonymous usage counts about once a week (which features are used, how often). No names, locations, weights or notes, and you can switch it off any time in Feedback.'),go));
  }
  function diagnostics(){
    var c={}; S.log.forEach(function(e){ c[e.type]=(c[e.type]||0)+1; }); var sp={}; S.birds.forEach(function(b){ sp[b.speciesId]=(sp[b.speciesId]||0)+1; }); var u=S.usage;
    return ['App: Stoop '+APP_VERSION,'Screen: '+innerWidth+'x'+innerHeight,'Browser: '+String(navigator.userAgent||'').slice(0,140),'Language: '+(navigator.language||''),
      'Installed as app: '+((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)?'yes':'no'),'Theme: '+S.theme+', unit: '+S.unit,
      'Birds: '+S.birds.length+' (species ids: '+JSON.stringify(sp)+')','Log entries by type: '+JSON.stringify(c),'Calendar dates: '+S.entries.length,'Neglect flag days: '+S.neglectDays,
      'Days used: '+u.days+(u.firstDay?' since '+u.firstDay:''),'Tab opens: '+JSON.stringify(u.tabs),'Reports opened: '+u.reports+', backups downloaded: '+u.backups+', restores: '+u.restores,
      'Forecast status: '+(typeof source!=='undefined'&&source?source:'not loaded')].join('\n');
  }
  /* ---------- sending: one small helper, used for feedback and (opt-in) usage ---------- */
  function newId(){ var a=new Uint8Array(8); (window.crypto||window.msCrypto).getRandomValues(a); return Array.prototype.map.call(a,function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); }
  function setShare(on){ if(on){ if(!S.installId) S.installId=newId(); S.shareUsage=true; } else { S.shareUsage=false; S.installId=''; S.usageSentAt=''; } }
  function canSend(){ return /^[0-9a-fA-F-]{20,60}$/.test(FEEDBACK_KEY); }
  function postToInbox(subject,message,replyTo){
    var body={access_key:FEEDBACK_KEY,subject:subject,from_name:'Stoop beta',message:message,botcheck:''}; if(replyTo) body.email=replyTo;
    return fetch(FEEDBACK_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)}).then(function(r){
      return r.json().then(function(j){ return j; },function(){ return {}; }).then(function(j){ if(!r.ok||j.success===false) throw new Error('send failed'); return j; }); });
  }
  function usageText(){
    var c={}; S.log.forEach(function(e){ c[e.type]=(c[e.type]||0)+1; }); var sp={}; S.birds.forEach(function(b){ sp[b.speciesId]=(sp[b.speciesId]||0)+1; }); var u=S.usage;
    return ['Stoop anonymous usage','Install: '+S.installId,'App: '+APP_VERSION,'First day: '+(u.firstDay||'')+', days used: '+u.days,'Tab opens: '+JSON.stringify(u.tabs),'Reports opened: '+u.reports+', backups: '+u.backups+', restores: '+u.restores,
      'Birds: '+S.birds.length+' '+JSON.stringify(sp),'Log entries by type: '+JSON.stringify(c),'Calendar dates: '+S.entries.length,'Theme: '+S.theme+', unit: '+S.unit,'Neglect flag days: '+S.neglectDays].join('\n');
  }
  function sendUsageIfDue(){
    if(!S.shareUsage||!S.installId||!canSend()||S.betaAck!==BETA_VERSION) return;
    var last=S.usageSentAt?Date.parse(S.usageSentAt):0; if(last&&Date.now()-last<7*86400000) return;
    try{ postToInbox('[Stoop usage] '+S.installId.slice(0,8),usageText()).then(function(){ S.usageSentAt=new Date().toISOString(); save(); },function(){}); }catch(e){}
  }
  function openFeedback(){
    bump('feedbackOpens');
    var type=h('select',{id:'fb-type'},['Something is broken','Something is confusing','I have an idea','Something I love','Other'].map(function(x){ return h('option',{value:x},x); })),
      msg=h('textarea',{id:'fb-msg',maxlength:'2000',style:'min-height:110px;font-family:inherit;font-size:1rem',placeholder:'What happened? What did you expect? Please leave out names, permit numbers and addresses.'}),
      mail=h('input',{id:'fb-mail',type:'email',maxlength:'120',autocomplete:'email',placeholder:'Optional, only if you want a reply'}),
      diag=h('input',{id:'fb-diag',type:'checkbox',checked:'checked',style:'width:auto'}),
      share=h('input',{id:'fb-share',type:'checkbox',style:'width:auto',checked:S.shareUsage?'checked':false}),
      prev=h('textarea',{id:'fb-preview',readonly:'readonly','aria-label':'Exactly what will be sent'}), note=h('p',{class:'note',role:'status',id:'fb-note'}), shareNote=h('p',{class:'note',id:'fb-share-note',style:'margin:0 0 10px'});
    function validMail(){ return mail.value.trim()===''||/^[^\s@]{1,64}@[^\s@]{1,190}$/.test(mail.value.trim()); }
    function text(){ return 'Stoop feedback\nType: '+type.value+'\n\n'+(msg.value.trim()||'(no message yet)')+(mail.value.trim()?'\n\nReply to: '+mail.value.trim():'')+(diag.checked?'\n\n--- Diagnostics (no names, location, weights or notes) ---\n'+diagnostics():''); }
    function refresh(){ prev.value=text(); shareNote.textContent=S.shareUsage?'Usage sharing is on. About once a week this is sent: '+usageText().replace(/\n/g,' | '):'Usage sharing is off. Nothing is sent unless you press Send.'; } [type,msg,mail,diag].forEach(function(e){ e.addEventListener('input',refresh); e.addEventListener('change',refresh); }); refresh();
    share.addEventListener('change',function(){ setShare(share.checked); save(); refresh(); if(share.checked) sendUsageIfDue(); });
    function copy(){ refresh(); try{ navigator.clipboard.writeText(prev.value).then(function(){ note.textContent='Copied.'; },function(){ prev.select(); note.textContent='Could not copy automatically. The text is selected, copy it by hand.'; }); }catch(e){ prev.select(); note.textContent='Could not copy automatically. The text is selected, copy it by hand.'; } }
    var sending=false, send=h('button',{class:'btn',id:'fb-send',type:'button',onclick:function(){
      if(sending) return; if(!msg.value.trim()){ note.textContent='Type a short message first.'; return; } if(!validMail()){ note.textContent='That email address does not look right. Fix it or leave it empty.'; return; }
      var d=new Date(),pp=function(n){return (n<10?'0':'')+n;},day=d.getFullYear()+'-'+pp(d.getMonth()+1)+'-'+pp(d.getDate()); if(S.fbDay!==day){ S.fbDay=day; S.fbCount=0; } if(S.fbCount>=5){ note.textContent='That is five messages today, which is the limit. Please try again tomorrow, or use Copy.'; return; }
      sending=true; send.setAttribute('disabled','disabled'); note.textContent='Sending...'; refresh();
      postToInbox('Stoop beta feedback: '+type.value,prev.value,mail.value.trim()).then(function(){ S.fbCount++; save(); msg.value=''; refresh(); note.textContent='Sent. Thank you, it goes straight to the maker.'; sending=false; send.removeAttribute('disabled'); },
        function(){ note.textContent='Could not send. Check your connection and try again, or use Copy and send it another way.'; sending=false; send.removeAttribute('disabled'); });
    }},'Send feedback');
    if(!canSend()){ send.setAttribute('disabled','disabled'); send.textContent='Sending not set up yet'; }
    openPanel('Send feedback',h('div',null,
      h('p',{class:'note',style:'margin-top:0'},'Stoop is a beta and your feedback is how it gets better. Write what you like, then check the preview below. It is sent only when you press Send, and it goes straight to the maker by email.'),
      h('div',{class:'field'},h('label',{for:'fb-type'},'What kind of feedback'),type),
      h('div',{class:'field',style:'margin-top:10px'},h('label',{for:'fb-msg'},'Your message'),msg),
      h('div',{class:'field',style:'margin-top:10px'},h('label',{for:'fb-mail'},'Your email (optional)'),mail),
      h('label',{for:'fb-diag',style:'display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--ink);font-weight:400'},diag,'Include diagnostics (app version, screen size, browser, counts of what you use)'),
      h('div',{class:'field'},h('label',{for:'fb-preview'},'Preview: exactly what will be sent'),prev),
      h('div',{class:'row',style:'margin-top:10px'},send,h('button',{class:'btn ghost small',id:'fb-copy',type:'button',onclick:copy},'Copy instead')),note,
      h('hr',{style:'border:0;border-top:1px solid var(--line);margin:12px 0'}),
      h('label',{for:'fb-share',style:'display:flex;gap:8px;align-items:flex-start;margin:0 0 6px;color:var(--ink);font-weight:400'},share,'Share anonymous usage counts about once a week (optional, off by default)'),shareNote,
      h('p',{class:'note',style:'margin-bottom:0'},'Feedback and usage counts are delivered by email through a form service (Web3Forms). Diagnostics and usage counts never include bird names, location, weights, notes or anything you typed in the app.')));
  }
  document.getElementById('fbbtn').addEventListener('click',openFeedback);
  function renderFoot(){
    var f=document.getElementById('foot'); f.textContent='';
    f.append(h('p',{style:'margin:0 0 8px'},'Beta software. Starter limits are rough guesses, not husbandry, veterinary or legal advice. You know your birds; this only flags the weather and keeps your records.'),
      h('div',{class:'row',style:'align-items:center'},h('button',{class:'btn ghost small',id:'foot-terms',type:'button',onclick:function(){ openPanel('Beta notes and terms',betaList()); }},'Beta notes and terms'),
        h('button',{class:'btn ghost small',id:'foot-fb',type:'button',onclick:openFeedback},'Send feedback')),
      h('p',{style:'margin:8px 0 0;font-size:.78rem'},'© 2026 Stoop. All rights reserved. '+APP_VERSION));
  }
  document.getElementById('ver').textContent=APP_VERSION;
  function promptCard(){
    if(S.fbPromptDone||S.usage.days<3) return null;
    return h('div',{class:'card',id:'fb-prompt'},h('h2',null,'How is Stoop going?'),h('p',{class:'note',style:'margin-top:0'},'You have used it on '+S.usage.days+' different days. What is the one thing that annoyed you, or that you wish it did?'),
      h('div',{class:'row'},h('button',{class:'btn small',type:'button',id:'fb-prompt-go',onclick:function(){ S.fbPromptDone=true; save(); renderAll(); openFeedback(); }},'Give feedback'),
        h('button',{class:'btn ghost small',type:'button',id:'fb-prompt-no',onclick:function(){ S.fbPromptDone=true; save(); renderAll(); }},'Not now')));
  }

  function renderAll(){
    if(S.betaAck!==BETA_VERSION){ renderBeta(); renderFoot(); return; }
    renderFoot();
    applyTheme(); renderTabs(); renderBirdBar();
    if(S.tab!=='cal'&&!bird()){ renderFirst(); return; }
    if(S.tab==='today') renderToday(); if(S.tab==='log') renderLog(); if(S.tab==='cal') renderCal(); if(S.tab==='birds') renderBirds();
  }
  renderAll();
  if(S.tab==='today'&&S.betaAck===BETA_VERSION) fetchForecast();
  sendUsageIfDue();
})();
</script>
