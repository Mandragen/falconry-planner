<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stoop</title>
<style>
/* Layout idea: a field notebook after dusk. Warm near-black, leather-tan accent,
   red/yellow/green reserved for weather status, a separate color per bird. */
:root{
  --paper:#f4efe6; --card:#fffdf8; --ink:#26201a; --mute:#6b6258; --line:#ddd3c4;
  --accent:#8a5a2b; --accent-ink:#ffffff;
  --go:#1f7a4d; --caut:#8f5d0d; --no:#b3392f; --on:#ffffff; --dk:#8a8178; --dkink:#ffffff;
  --display:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151210; --card:#211c19; --ink:#f3ece2; --mute:#b4a99b; --line:#3a322c;
    --accent:#d4a96a; --accent-ink:#1a140d;
    --go:#4fc487; --caut:#f0c63c; --no:#f27266; --on:#0d0b0a; --dk:#2e2823; --dkink:#b4a99b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151210; --card:#211c19; --ink:#f3ece2; --mute:#b4a99b; --line:#3a322c;
  --accent:#d4a96a; --accent-ink:#1a140d;
  --go:#4fc487; --caut:#f0c63c; --no:#f27266; --on:#0d0b0a; --dk:#2e2823; --dkink:#b4a99b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-family:var(--display);font-size:1.9rem;margin:0;letter-spacing:.02em}
h2{font-family:var(--display);font-size:1.2rem;margin:0 0 8px;text-wrap:balance}
h3{font-size:.95rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 10px;font-size:.88rem}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:6px 0 14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:inherit;font-weight:600;padding:8px 2px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 120px;min-width:0}
label{font-size:.82rem;color:var(--mute);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;min-width:0}
textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:.82rem}
.btn{font:inherit;font-weight:700;padding:9px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.themebtn{font-size:.8rem;padding:5px 10px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{display:flex;gap:8px;align-items:center;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;text-align:left}
.chip small{display:block;font-weight:400;font-size:.72rem;color:var(--mute);line-height:1.2}
.chip[aria-pressed="true"]{border-color:var(--bc);box-shadow:0 0 0 1px var(--bc)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--bc);flex:none}
.banner{border-left:10px solid var(--bc);background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 14px}
.banner b{font-size:1.02rem}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mute);vertical-align:middle}
.glance{width:100%;border-collapse:collapse;margin-top:8px;font-size:.9rem}
.glance td,.glance th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.glance th{font-size:.75rem;color:var(--mute);border-top:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-weight:700;font-size:.78rem;background:var(--dk);color:var(--dkink)}
.pill.GO{background:var(--go);color:var(--on)} .pill.CAUTION{background:var(--caut);color:var(--on)} .pill.NOGO{background:var(--no);color:var(--on)}
.alert{border-left:10px solid var(--dk)}
.alert.L2{border-left-color:var(--no)} .alert.L1{border-left-color:var(--caut)} .alert.L0{border-left-color:var(--go)}
.hero{border-left:10px solid var(--dk)}
.hero.GO{border-left-color:var(--go)} .hero.CAUTION{border-left-color:var(--caut)} .hero.NOGO{border-left-color:var(--no)}
.big{font-family:var(--display);font-size:1.9rem;margin:0;font-weight:700}
.big.GO{color:var(--go)} .big.CAUTION{color:var(--caut)} .big.NOGO{color:var(--no)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
@media(min-width:560px){.grid{grid-template-columns:repeat(8,1fr)}}
.cell{border:0;border-radius:8px;padding:7px 2px;text-align:center;font:inherit;font-size:.78rem;line-height:1.2;cursor:pointer;color:var(--dkink);background:var(--dk)}
.cell b{display:block;font-size:.95rem}
.cell.GO{background:var(--go);color:var(--on)} .cell.CAUTION{background:var(--caut);color:var(--on)} .cell.NOGO{background:var(--no);color:var(--on)}
.cell[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mute)}
.why{margin:10px 0 0;padding-left:20px;font-size:.92rem}
.why li,ul.reasons li{margin:3px 0}
.item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item>div{min-width:0}
.item .t{font-weight:700}
.item .m{color:var(--mute);font-size:.88rem}
.soon{color:var(--caut);font-weight:700}
.past{opacity:.55}
.note{font-size:.84rem;color:var(--mute)}
.warn{border:1px solid var(--caut);border-radius:8px;padding:8px 10px;font-size:.88rem;margin:0 0 14px}
ul.reasons{margin:6px 0 0;padding-left:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px}
.stat b{display:block;font-size:1.15rem}
.stat span{font-size:.75rem;color:var(--mute)}
details summary{cursor:pointer;font-weight:600}
a{color:var(--accent)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:var(--bc);cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.cmp{width:100%;border-collapse:collapse;font-size:.88rem}
.cmp th,.cmp td{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.cmp th{font-size:.72rem;color:var(--mute);border-top:0}
.cmp input{padding:6px;max-width:90px}
.cmp .tbl{overflow-x:auto}
svg.chart text{fill:var(--mute);font-size:9px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.cell,.btn,.chip{transition:transform .08s}.cell:active,.btn:active,.chip:active{transform:scale(.97)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Stoop</h1>
      <p class="sub">Falconry field planner</p>
    </div>
    <button class="btn ghost themebtn" id="themebtn" type="button">Light mode</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="birdbar"></div>
  <section id="tab-today" role="tabpanel"></section>
  <section id="tab-log" role="tabpanel" hidden></section>
  <section id="tab-cal" role="tabpanel" hidden></section>
  <section id="tab-birds" role="tabpanel" hidden></section>
  <p class="note" style="margin-top:24px">Starter limits are rough guesses, not husbandry advice. Set them for your own birds. You know your birds; this only flags the weather and keeps your records.</p>
</div>

<script id="logic">
/* Pure logic: no DOM. Tested in Node. */
var FP = (function(){
  var LIMIT_KEYS=['minTemp','maxTemp','maxWind','maxGust','maxPop','coldTemp','heatTemp','stormGust'];
  var SPECIES=[
    {id:'rt',name:'Red-tailed hawk',minTemp:20,maxTemp:85,maxWind:15,maxGust:22,maxPop:30,coldTemp:10,heatTemp:90,stormGust:35},
    {id:'hh',name:"Harris's hawk",minTemp:30,maxTemp:90,maxWind:15,maxGust:20,maxPop:30,coldTemp:25,heatTemp:95,stormGust:30},
    {id:'pf',name:'Peregrine falcon',minTemp:15,maxTemp:85,maxWind:20,maxGust:28,maxPop:25,coldTemp:5,heatTemp:88,stormGust:35},
    {id:'ch',name:"Cooper's hawk",minTemp:25,maxTemp:90,maxWind:12,maxGust:18,maxPop:25,coldTemp:15,heatTemp:90,stormGust:30},
    {id:'ak',name:'American kestrel',minTemp:30,maxTemp:90,maxWind:12,maxGust:18,maxPop:20,coldTemp:20,heatTemp:92,stormGust:30},
    {id:'other',name:'Other or unlisted',minTemp:25,maxTemp:85,maxWind:15,maxGust:22,maxPop:30,coldTemp:20,heatTemp:90,stormGust:30}
  ];
  var DEMO_NAMES={rt:'Juno',hh:'Ajax',pf:'Skye',ch:'Willow',ak:'Pip'};
  var COLORS=['#3b82f6','#8b5cf6','#ec4899','#06b6d4','#78716c','#f97316'];
  function speciesById(id){ for(var i=0;i<SPECIES.length;i++) if(SPECIES[i].id===id) return SPECIES[i]; return SPECIES[SPECIES.length-1]; }
  /* A bird's working limits: its own override if set, else the species starter value. */
  function effective(bird){
    var sp=speciesById(bird.speciesId), o=bird.limits||{}, out={name:bird.name,species:sp.name};
    LIMIT_KEYS.forEach(function(k){ out[k]=(typeof o[k]==='number'&&!isNaN(o[k]))?o[k]:sp[k]; });
    return out;
  }
  function rate(v, lim, margin, dir){
    if(dir==='max'){ if(v>lim) return 2; if(v>lim-margin) return 1; return 0; }
    if(v<lim) return 2; if(v<lim+margin) return 1; return 0;
  }
  function scoreHour(h, p){
    var reasons=[], worst=0;
    function add(lvl, txt){ if(lvl>0){ reasons.push((lvl===2?'Over limit: ':'Close to limit: ')+txt); if(lvl>worst) worst=lvl; } }
    if(h.day===false) return {level:3,key:'DARK',label:'Dark',reasons:['After dark']};
    add(rate(h.temp,p.minTemp,5,'min'),'temperature '+Math.round(h.temp)+'F, minimum '+p.minTemp+'F');
    add(rate(h.temp,p.maxTemp,5,'max'),'temperature '+Math.round(h.temp)+'F, maximum '+p.maxTemp+'F');
    add(rate(h.wind,p.maxWind,3,'max'),'wind '+Math.round(h.wind)+' mph, maximum '+p.maxWind);
    add(rate(h.gust,p.maxGust,4,'max'),'gusts '+Math.round(h.gust)+' mph, maximum '+p.maxGust);
    add(rate(h.pop,p.maxPop,10,'max'),'rain chance '+Math.round(h.pop)+'%, maximum '+p.maxPop+'%');
    if(h.precip>=0.03) add(2,'rain falling, '+h.precip.toFixed(2)+' in/hr');
    else if(h.precip>=0.01) add(1,'light rain, '+h.precip.toFixed(2)+' in/hr');
    var keys=['GO','CAUTION','NOGO'], labels=['Go','Caution','No-go'];
    return {level:worst,key:keys[worst],label:labels[worst],reasons:reasons};
  }
  function hourLabel(t){ var H=+t.slice(11,13); return (H%12||12)+(H<12?'a':'p'); }
  function endLabel(t){ var e=(+t.slice(11,13)+1)%24; return (e%12||12)+(e<12?'a':'p'); }
  function dayLabel(t){
    var d=new Date(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10),+t.slice(11,13));
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+hourLabel(t);
  }
  function bestWindow(scored, strict){
    var best=null, cur=null, max=strict?0:1;
    for(var i=0;i<scored.length;i++){
      var ok=scored[i].s.level<=max;
      if(ok){ if(!cur) cur={start:i,end:i}; else cur.end=i; if(!best||(cur.end-cur.start)>(best.end-best.start)) best={start:cur.start,end:cur.end}; }
      else cur=null;
    }
    return best;
  }
  function pickWindow(scored){
    var w=bestWindow(scored,true), strict=true;
    if(!w){ w=bestWindow(scored,false); strict=false; }
    return w?{start:w.start,end:w.end,strict:strict}:null;
  }
  function edgeWhy(r){
    if(r.s.key==='DARK') return 'it is after dark';
    var why=r.s.reasons.length?r.s.reasons[0].replace(/^[^:]+: /,''):'';
    return hourLabel(r.x.time)+' is '+r.s.label.toLowerCase()+(why?' ('+why+')':'');
  }
  function explainWindow(scored, w, p){
    var hrs=scored.slice(w.start,w.end+1).map(function(r){return r.x;});
    function rg(k){ var v=hrs.map(function(x){return x[k];}); return [Math.min.apply(null,v),Math.max.apply(null,v)]; }
    var t=rg('temp'), wi=rg('wind'), g=rg('gust'), pp=rg('pop'), lines=[];
    lines.push(w.strict?'It is the longest daylight stretch where every reading stays inside the limits.':'No hour is fully clear, so this is the longest daylight stretch with nothing over a limit.');
    lines.push('During it: '+Math.round(t[0])+' to '+Math.round(t[1])+'F, wind up to '+Math.round(wi[1])+' mph, gusts up to '+Math.round(g[1])+' mph, rain chance up to '+Math.round(pp[1])+'%.');
    var c=[['wind',wi[1],p.maxWind,'mph'],['gusts',g[1],p.maxGust,'mph'],['rain chance',pp[1],p.maxPop,'%']], tight=null;
    c.forEach(function(x){ var m=(x[2]-x[1])/x[2]; if(!tight||m<tight.m) tight={m:m,c:x}; });
    lines.push('Closest to a limit: '+tight.c[0]+', '+Math.round(tight.c[1])+' of '+tight.c[2]+' '+tight.c[3]+'.');
    var lowGap=t[0]-p.minTemp, highGap=p.maxTemp-t[1], tg=Math.min(lowGap,highGap);
    if(tg<=10) lines.push('Temperature is within '+Math.round(tg)+'F of the '+(lowGap<highGap?p.minTemp+'F minimum':p.maxTemp+'F maximum')+'.');
    var before=scored[w.start-1], after=scored[w.end+1];
    lines.push(before?'It starts here because '+edgeWhy(before)+'.':'It starts at the beginning of the forecast.');
    lines.push(after?'It ends because '+edgeWhy(after)+'.':'It runs to the end of the forecast.');
    return lines;
  }
  /* Every hour the weather service returned (a day back plus the forecast). */
  function parseAll(j){
    var H=j.hourly, out=[];
    for(var i=0;i<H.time.length;i++){
      out.push({time:H.time[i],temp:H.temperature_2m[i],feels:H.apparent_temperature?H.apparent_temperature[i]:H.temperature_2m[i],
        wind:H.wind_speed_10m[i],gust:H.wind_gusts_10m[i],pop:H.precipitation_probability[i]||0,precip:H.precipitation[i]||0,
        code:H.weather_code?H.weather_code[i]:0,day:H.is_day[i]===1});
    }
    return out;
  }
  function parseForecast(j){
    var all=parseAll(j), off=j.utc_offset_seconds||0, nowLoc=new Date(Date.now()+off*1000).toISOString().slice(0,13), start=0;
    for(var k=0;k<all.length;k++){ if(all[k].time.slice(0,13)>=nowLoc){ start=k; break; } }
    return all.slice(start,start+48);
  }
  function hourAt(all, ts){
    if(!all||!ts) return null; var key=ts.slice(0,13);
    for(var i=0;i<all.length;i++) if(all[i].time.slice(0,13)===key) return all[i];
    return null;
  }
  function demoForecast(){
    var out=[], d=new Date(), base=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours());
    var pad=function(n){return (n<10?'0':'')+n;};
    for(var i=-24;i<48;i++){
      var t=new Date(base.getTime()+i*3600000), H=t.getHours();
      var ts=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())+'T'+pad(H)+':00';
      var temp=38+14*Math.sin((H-9)/24*2*Math.PI)+8-(i>=24?9:0), wind=5+7*Math.abs(Math.sin(H/5)), rainy=(H>=15&&H<=17&&i>=0&&i<24);
      out.push({time:ts,temp:temp,feels:temp-wind*0.4,wind:wind,gust:9+10*Math.abs(Math.sin(H/5)),
        pop:H>=14&&H<=18?55:10,precip:rainy?0.05:0,code:rainy?80:0,day:H>=7&&H<=17});
    }
    return out;
  }
  function outlook(all, p, startKey, maxDays){
    var days=[], byDate={}, order=[];
    for(var i=0;i<all.length;i++){
      var t=all[i].time; if(t.slice(0,13)<startKey) continue;
      var d=t.slice(0,10); if(!byDate[d]){ byDate[d]=[]; order.push(d); }
      byDate[d].push(all[i]);
    }
    order.slice(0,maxDays).forEach(function(d){
      var hrs=byDate[d], dayHrs=hrs.filter(function(x){return x.day!==false;}), r={date:d,hours:hrs.length,daylight:dayHrs.length};
      var sh=dayHrs.length?dayHrs:hrs;
      var temps=sh.map(function(x){return x.temp;}), gusts=sh.map(function(x){return x.gust;}), winds=sh.map(function(x){return x.wind;}), pops=sh.map(function(x){return x.pop;});
      r.hi=Math.round(Math.max.apply(null,temps)); r.lo=Math.round(Math.min.apply(null,temps));
      r.maxWind=Math.round(Math.max.apply(null,winds)); r.maxGust=Math.round(Math.max.apply(null,gusts)); r.maxPop=Math.round(Math.max.apply(null,pops));
      if(!dayHrs.length){ r.key='DARK'; r.label='No daylight left'; r.win=null; days.push(r); return; }
      var sc=dayHrs.map(function(x){return {x:x,s:scoreHour(x,p)};}), w=pickWindow(sc), n=w?(w.end-w.start+1):0;
      if(w&&w.strict&&n>=2){ r.key='GO'; r.label='Go'; }
      else if(w&&(w.strict||n>=2)){ r.key='CAUTION'; r.label='Caution'; }
      else { r.key='NOGO'; r.label='No-go'; }
      r.win=w?{from:hourLabel(sc[w.start].x.time),to:endLabel(sc[w.end].x.time),hours:n,strict:w.strict}:null;
      days.push(r);
    });
    return days;
  }
  function futureFrom(all){
    var d=new Date(), pad=function(n){return (n<10?'0':'')+n;};
    var key=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours());
    for(var i=0;i<all.length;i++) if(all[i].time.slice(0,13)>=key) return all.slice(i,i+48);
    return all.slice(0,48);
  }
  var SEVERE=[[[95,96,99],2,'Thunderstorms possible'],[[56,57,66,67],2,'Freezing rain or drizzle possible'],[[75,86],2,'Heavy snow possible'],[[71,73,77,85],1,'Snow possible']];
  function housingAlerts(hrs, p){
    var items=[], level=0, minF=null, maxT=null, maxG=null;
    function add(l,txt){ items.push({level:l,text:txt}); if(l>level) level=l; }
    hrs.forEach(function(x){
      var f=(x.feels==null?x.temp:x.feels);
      if(!minF||f<minF.v) minF={v:f,t:x.time}; if(!maxT||x.temp>maxT.v) maxT={v:x.temp,t:x.time}; if(!maxG||x.gust>maxG.v) maxG={v:x.gust,t:x.time};
    });
    if(!minF) return {level:0,items:[]};
    if(minF.v<=p.coldTemp) add(2,'Feels-like drops to '+Math.round(minF.v)+'F around '+dayLabel(minF.t)+'. Cold limit is '+p.coldTemp+'F.');
    else if(minF.v<=p.coldTemp+8) add(1,'Feels-like gets down to '+Math.round(minF.v)+'F around '+dayLabel(minF.t)+', close to the '+p.coldTemp+'F cold limit.');
    if(maxT.v>=p.heatTemp) add(2,'High of '+Math.round(maxT.v)+'F around '+dayLabel(maxT.t)+'. Heat limit is '+p.heatTemp+'F.');
    else if(maxT.v>=p.heatTemp-5) add(1,'High of '+Math.round(maxT.v)+'F around '+dayLabel(maxT.t)+', close to the '+p.heatTemp+'F heat limit.');
    if(maxG.v>=p.stormGust) add(2,'Gusts to '+Math.round(maxG.v)+' mph around '+dayLabel(maxG.t)+'. Wind limit for outdoor housing is '+p.stormGust+' mph.');
    else if(maxG.v>=p.stormGust-5) add(1,'Gusts to '+Math.round(maxG.v)+' mph around '+dayLabel(maxG.t)+', close to the '+p.stormGust+' mph limit.');
    SEVERE.forEach(function(s){
      for(var i=0;i<hrs.length;i++){ if(s[0].indexOf(hrs[i].code)>=0){ add(s[1],s[2]+' around '+dayLabel(hrs[i].time)+'.'); break; } }
    });
    return {level:level,items:items};
  }
  function toGrams(v,unit){ return unit==='oz'?v*28.3495:v; }

    if(pa.length) root.append(listCard('Past',pa,''));
    var box=h('textarea',{id:'c-json','aria-label':'Backup or calendar file text'}), icsNote=h('p',{class:'note',role:'status'});
    root.append(h('div',{class:'card'},h('h2',null,'Data and calendar sync'),
      h('p',{class:'note',style:'margin-top:0'},'Each date has an Add to Google Calendar link. The .ics file works with Apple Calendar, Outlook and others and includes every upcoming date, with a 7-day reminder on permits. Live two-way sync needs a hosted version and is a later stage.'),
      h('p',{class:'note'},'North Carolina starter dates come from the NC Falconers Guild events page and the NC extended falconry season table, each with its source. The source pages do not state every year, so verify against the official guide before you plan around them. Your falconry license renewal date was not on a public page, so add yours as a permit.'),
      h('div',{class:'row',style:'margin-bottom:8px'},
        h('button',{class:'btn small',id:'c-nc',type:'button',onclick:function(){ var have={}; S.entries.forEach(function(e){have[e.id]=1;}); FP.REF_NC.forEach(function(r){ if(!have[r.id]) S.entries.push(JSON.parse(JSON.stringify(r))); }); save(); renderCal(); }},'Load North Carolina starter dates'),
        h('button',{class:'btn small',id:'c-ics',type:'button',onclick:function(){
          var ics=FP.toICS(S.entries.filter(function(e){return FP.daysUntil(e.end||e.date)>=0;}),TYPES); box.value=ics;
          try{ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download='stoop-calendar.ics'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
          try{ navigator.clipboard.writeText(ics); }catch(e){} icsNote.textContent='Calendar file text is in the box below. If no download started, copy the text into a file ending in .ics and open it with Apple Calendar, Outlook, or Google Calendar.'; }},'Calendar file (.ics) for phone or Outlook'),
        h('button',{class:'btn ghost small',id:'c-export',type:'button',onclick:function(){ box.value=JSON.stringify({entries:S.entries,birds:S.birds,loc:S.loc,birdId:S.birdId,log:S.log,unit:S.unit}); box.select(); try{ navigator.clipboard.writeText(box.value); }catch(e){} icsNote.textContent='Backup text is in the box below.'; }},'Show and copy backup'),
        h('button',{class:'btn ghost small',id:'c-import',type:'button',onclick:function(){ try{ var j=JSON.parse(box.value); if(j.entries&&j.birds){ S.entries=j.entries; S.birds=j.birds; S.loc=j.loc||S.loc; S.birdId=j.birdId||S.birdId; S.log=j.log||[]; S.unit=j.unit||S.unit; S=migrate(S); save(); renderAll(); } else throw 0; }catch(e){ box.value='That is not a valid backup. Paste the full backup text.'; } }},'Restore from text')),icsNote,box));
  }
  function listCard(title,items,empty){
    var c=h('div',{class:'card'},h('h2',null,title));
    if(!items.length){ c.append(h('p',{class:'note'},empty)); return c; }
    items.forEach(function(e){
      var n=FP.daysUntil(e.date), st=null, when;
      if(e.type==='season'){ st=FP.seasonStatus(e.date,e.end); when=st.text; }
      else if(e.end && FP.daysUntil(e.end)>=0 && n<0){ when='Under way, ends '+FP.whenText(FP.daysUntil(e.end)).toLowerCase(); }
      else when=FP.whenText(n);
      var soon=(n>=0&&n<=30)||(st&&st.state==='open');
      c.append(h('div',{class:'item'+(FP.daysUntil(e.end||e.date)<0?' past':'')},
        h('div',null,h('div',{class:'t'},e.title),
          h('div',{class:'m'},TYPES[e.type]+' · '+e.date+(e.end?' to '+e.end:'')),
          h('div',{class:soon?'soon':'m'},when),
          e.notes?h('div',{class:'m'},e.notes):null,
          e.src?h('div',{class:'m'},'Source: ',h('a',{href:e.src,target:'_blank',rel:'noopener'},e.src.replace(/^https?:\/\//,'').split('/')[0])):null,
          h('div',{class:'m'},h('a',{href:FP.googleLink(e,TYPES),target:'_blank',rel:'noopener'},'Add to Google Calendar'))),
        h('button',{class:'btn ghost small',type:'button','aria-label':'Delete '+e.title,onclick:function(){ S.entries=S.entries.filter(function(x){return x.id!==e.id;}); save(); renderCal(); }},'Delete')));
    });
    return c;
  }

  /* ---------- birds ---------- */
  var removing=null;
  var LIMITS=[['minTemp','Lowest flying temp (F)'],['maxTemp','Highest flying temp (F)'],['maxWind','Max wind to fly (mph)'],['maxGust','Max gusts to fly (mph)'],['maxPop','Max rain chance to fly (%)'],
    ['coldTemp','Cold limit for housing, feels-like (F)'],['heatTemp','Heat limit for housing (F)'],['stormGust','Wind limit for outdoor housing (mph)']];
  function renderBirds(){
    var root=document.getElementById('tab-birds'); root.textContent='';
    var b=bird(), sp=FP.speciesById(b.speciesId), mine=S.log.filter(function(e){return e.birdId===b.id&&e.type==='flight';}), fr=FP.flownRange(mine);
    root.append(banner('Editing'));
    function text(id,label,key,type){ return h('div',{class:'field',style:'flex:1 1 150px'},h('label',{for:id},label),h('input',{id:id,type:type||'text',value:b[key]||'',onchange:function(e){ b[key]=e.target.value; save(); renderAll(); }})); }
    var speciesSel=h('select',{id:'b-species',onchange:function(e){ b.speciesId=e.target.value; save(); renderAll(); }},FP.SPECIES.map(function(x){return h('option',{value:x.id,selected:x.id===b.speciesId?'selected':false},x.name);}));
    var sexSel=h('select',{id:'b-sex',onchange:function(e){ b.sex=e.target.value; save(); }},['','Female','Male'].map(function(x){return h('option',{value:x,selected:x===b.sex?'selected':false},x||'Not set');}));
    var wf=b.flyG?+FP.fromGrams(b.flyG,S.unit).toFixed(S.unit==='oz'?1:0):'';
    var wInp=h('input',{id:'b-flyG',type:'number',step:'any',value:wf,onchange:function(e){ var v=num(e.target.value,NaN); b.flyG=isNaN(v)||v<=0?null:FP.toGrams(v,S.unit); save(); }});
    var sw=h('div',{class:'sw',role:'group','aria-label':'Bird color'});
    FP.COLORS.forEach(function(c,i){ sw.append(h('button',{type:'button','aria-label':'Color '+(i+1),'aria-pressed':String(b.color===c),style:'--bc:'+c,onclick:function(){ b.color=c; save(); renderAll(); }})); });
    var notes=h('textarea',{id:'b-notes','aria-label':'Notes about '+b.name,style:'min-height:70px;font-family:inherit;font-size:1rem',onchange:function(e){ b.notes=e.target.value; save(); }}); notes.value=b.notes||'';
    root.append(h('div',{class:'card'},h('h2',null,'About '+b.name),
      b.isDemo?h('p',{class:'note',style:'margin-top:0'},'This is a demo bird. Rename it, change the species, or remove it, then add your own.'):null,
      h('div',{class:'row'},text('b-name','Name','name'),h('div',{class:'field',style:'flex:1 1 150px'},h('label',{for:'b-species'},'Species'),speciesSel),h('div',{class:'field',style:'flex:1 1 110px'},h('label',{for:'b-sex'},'Sex'),sexSel)),
      h('div',{class:'row',style:'margin-top:10px'},text('b-band','Band or ID (optional)','band'),text('b-acq','Acquired','acquired','date'),h('div',{class:'field',style:'flex:1 1 150px'},h('label',{for:'b-flyG'},'Target weight ('+S.unit+', optional)'),wInp)),
      h('div',{class:'field',style:'margin-top:10px'},h('label',{for:'b-notes'},'Notes'),notes),
      h('h3',{style:'margin-top:14px'},'Bird color'),sw));

    var cur=eff(b), flownOf={minTemp:fr?'as low as '+fr.minTemp+'F':null,maxTemp:fr?'as high as '+fr.maxTemp+'F':null,maxWind:fr?'up to '+fr.maxWind:null,maxGust:fr?'up to '+fr.maxGust:null,maxPop:fr?'up to '+fr.maxPop+'%':null};
    var tbody=h('tbody');
    LIMITS.forEach(function(l){
      var k=l[0], own=b.limits[k];
      var inp=h('input',{id:'lim-'+k,type:'number',step:'any','aria-label':l[1]+' for '+b.name,placeholder:String(sp[k]),value:(typeof own==='number')?own:'',onchange:function(e){
        var v=parseFloat(e.target.value); if(isNaN(v)) delete b.limits[k]; else b.limits[k]=v; save(); renderBirds(); }});
      tbody.append(h('tr',null,h('td',null,l[1]),h('td',null,String(sp[k])),h('td',null,inp),h('td',null,String(cur[k])),h('td',null,flownOf[k]||(fr?'':'No good flights yet'))));
    });
    root.append(h('div',{class:'card'},h('h2',null,b.name+' compared with the species'),
      h('p',{class:'note',style:'margin-top:0'},'The species column is the starter value for '+sp.name+'. Type a number in the '+b.name+' column to override it for this bird. Leave it empty to use the species value. "Flown in" shows what '+b.name+' has done in good flights.'),
      h('div',{class:'tbl'},h('table',{class:'cmp'},h('thead',null,h('tr',null,h('th',null,'Limit'),h('th',null,sp.name),h('th',null,b.name+' (yours)'),h('th',null,'Used now'),h('th',null,'Flown in'))),tbody)),
      h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn ghost small',id:'b-reset',type:'button',onclick:function(){ b.limits={}; save(); renderBirds(); }},'Reset to species values'))));

    var rm=h('button',{class:'btn ghost small',id:'b-remove',type:'button',onclick:function(){
      if(removing!==b.id){ removing=b.id; rm.textContent='Tap again to remove '+b.name+' and its log'; return; }
      S.birds=S.birds.filter(function(x){return x.id!==b.id;}); S.log=S.log.filter(function(e){return e.birdId!==b.id;}); S.birdId=S.birds.length?S.birds[0].id:null; removing=null; save(); renderAll(); }},'Remove '+b.name);
    root.append(h('div',{class:'card'},h('h2',null,'Your birds'),
      h('div',{class:'row'},rm,h('button',{class:'btn',id:'b-new',type:'button',onclick:function(){
        var id='c'+Date.now(), used=S.birds.length; S.birds.push({id:id,name:'New bird',speciesId:'other',limits:{},color:FP.COLORS[used%FP.COLORS.length],flyG:null,sex:'',band:'',acquired:'',notes:''});
        S.birdId=id; save(); renderAll(); }},'Add a bird'))));
  }

  function renderAll(){
    applyTheme(); renderTabs(); renderBirdBar();
    if(S.tab!=='cal'&&!bird()){ renderFirst(); return; }
    if(S.tab==='today') renderToday(); if(S.tab==='log') renderLog(); if(S.tab==='cal') renderCal(); if(S.tab==='birds') renderBirds();
  }
  renderAll();
  if(S.tab==='today') fetchForecast();
})();
</script>
</body>
</html>
